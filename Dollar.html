<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #121212;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .converter-container {
            background: #1e1e1e;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7), 0 0 0 1px #333 inset;
            width: 100%;
            max-width: 450px;
        }

        .title {
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.4rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .label {
            color: #bbb;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
        }

        .amount-input {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #444;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 1.2rem;
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }

        .amount-input:focus {
            border-color: #00ff99;
            box-shadow: 0 0 10px #00ff9966;
        }

        .currency-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .currency-select {
            flex: 1;
        }

        select {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #444;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 1.1rem;
            color: #fff;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 20px center;
            background-size: 16px;
        }

        select:focus {
            border-color: #00ff99;
            box-shadow: 0 0 10px #00ff9966;
        }

        .convert-btn {
            width: 100%;
            background: #2a2a2a;
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #e0e0e0;
            cursor: pointer;
            box-shadow: 0 5px 0 #0f0f0f, 0 8px 12px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .convert-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f0f0f, 0 5px 8px rgba(0, 0, 0, 0.5);
        }

        .convert-btn:hover {
            background: #3a3a3a;
        }

        .result-box {
            margin-top: 30px;
            background: #0f0f0f;
            border-radius: 60px;
            padding: 20px;
            text-align: center;
            border: 1px solid #444;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00ff99;
            text-shadow: 0 0 10px #00ff9966;
            word-break: break-word;
        }

        .error-message {
            color: #ff6666;
            font-size: 0.9rem;
            margin-top: 8px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="converter-container">
        <div class="title">⚡ Currency Converter ⚡</div>

        <div class="input-group">
            <label class="label">Сумма</label>
            <input type="number" id="amount" class="amount-input" value="1.00" step="0.01" min="0">
        </div>

        <div class="currency-row">
            <div class="currency-select">
                <label class="label">Из</label>
                <select id="fromCurrency">
                    <option value="USD" selected>USD</option>
                    <option value="EUR">EUR</option>
                    <option value="JPY">JPY</option>
                    <option value="GBP">GBP</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                    <option value="CHF">CHF</option>
                    <option value="CNY">CNY</option>
                    <option value="INR">INR</option>
                </select>
            </div>
            <div class="currency-select">
                <label class="label">В</label>
                <select id="toCurrency">
                    <option value="USD">USD</option>
                    <option value="EUR" selected>EUR</option>
                    <option value="JPY">JPY</option>
                    <option value="GBP">GBP</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                    <option value="CHF">CHF</option>
                    <option value="CNY">CNY</option>
                    <option value="INR">INR</option>
                </select>
            </div>
        </div>

        <button class="convert-btn" id="convertBtn">⟫ Конвертировать</button>

        <div class="result-box">
            <div class="result-value" id="result">0.00</div>
        </div>
        <div class="error-message" id="error"></div>
    </div>

    <script>
        (function() {
            // Курсы валют относительно USD (как в Java)
            const rates = {
                USD: 1.00,
                EUR: 0.84,
                JPY: 109.65,
                GBP: 0.72,
                CAD: 1.27,
                AUD: 1.30,
                CHF: 0.92,
                CNY: 6.47,
                INR: 87.14
            };

            const amountInput = document.getElementById('amount');
            const fromSelect = document.getElementById('fromCurrency');
            const toSelect = document.getElementById('toCurrency');
            const convertBtn = document.getElementById('convertBtn');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');

            function formatNumber(value) {
                return value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function convert() {
                const amountStr = amountInput.value.trim();
                if (amountStr === '') {
                    errorDiv.textContent = 'Введите сумму';
                    resultDiv.textContent = '0.00';
                    return;
                }

                const amount = parseFloat(amountStr);
                if (isNaN(amount) || amount < 0) {
                    errorDiv.textContent = 'Некорректная сумма';
                    resultDiv.textContent = '0.00';
                    return;
                }

                const fromCurrency = fromSelect.value;
                const toCurrency = toSelect.value;

                const rateFrom = rates[fromCurrency];
                const rateTo = rates[toCurrency];

                // Конвертация: (amount * rateTo) / rateFrom
                const result = amount * (rateTo / rateFrom);
                resultDiv.textContent = formatNumber(result) + ' ' + toCurrency;
                errorDiv.textContent = '';
            }

            convertBtn.addEventListener('click', convert);
            amountInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') convert();
            });

            // Начальная конвертация
            convert();
        })();
    </script>
</body>
</html>
